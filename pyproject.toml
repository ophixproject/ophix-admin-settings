[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ophix-admin-settings"
version = "2026.06.06.01"
description = "Instance settings for Ophix Project Servers — server identity, environment, and language"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Ophix Project" }
]
keywords = ["django", "ophix", "admin", "settings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "ophix-server-base>=2026.05.30.05",
]

[project.urls]
Homepage = "https://ophix.io"

[project.entry-points."ophix.plugins"]
ophix_admin_settings = "ophix_admin_settings"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ophix_admin_settings" = [
    "OPHIX_RELEASE_NOTES.md",
    "deploy_templates/**/*",
    "docs/**/*",
]
